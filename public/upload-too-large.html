<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>File too large</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #eef2f7;
        color: #172033;
      }
      main {
        max-width: 680px;
        margin: 12vh auto;
        padding: 32px;
        border: 1px solid #d7dee8;
        border-radius: 8px;
        background: #fff;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }
      p {
        font-size: 16px;
        line-height: 1.5;
      }
      a {
        color: #146c94;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>File upload is too large</h1>
      <p>The selected supporting document is larger than the upload limit. Please compress the PDF or image and try again.</p>
      <p>If the file is below 5 MB and this message still appears, contact Accounts or IT with the file size and claim details.</p>
      <p><a href="/dashboard">Return to dashboard</a></p>
    </main>
  </body>
</html>
