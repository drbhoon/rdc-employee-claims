<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>File too large</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #eef2f7;
        color: #172033;
      }
      main {
        max-width: 680px;
        margin: 12vh auto;
        padding: 32px;
        border: 1px solid #d7dee8;
        border-radius: 8px;
        background: #fff;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }
      p {
        font-size: 16px;
        line-height: 1.5;
      }
      a {
        color: #146c94;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>File upload is too large</h1>
      <p>Your attachments exceed 10 MB. Please compress and resubmit.</p>
      <p>The 10 MB request limit includes all attachments and claim details. Each individual file must also be no larger than 5 MB.</p>
      <p><a href="/dashboard">Return to dashboard</a></p>
    </main>
  </body>
</html>
